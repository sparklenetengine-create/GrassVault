<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#09090b" /><title>GrassVault</title><link rel="stylesheet" href="./popup.css" /></head>
  <body class="text-zinc-100 antialiased">
    <main class="space-y-4 p-5">
      <header class="flex items-center justify-between"><div class="flex items-center gap-3"><div class="grid h-10 w-10 place-items-center rounded-xl border border-cyan-400/20 bg-cyan-400/10 text-lg text-cyan-300" aria-hidden="true">◈</div><div><h1 class="text-base font-semibold tracking-tight">GrassVault</h1><p class="text-xs text-zinc-500">Private intelligence, at the edge</p></div></div><span id="connection-status" class="rounded-full border border-zinc-700 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-wider text-zinc-400" role="status">Loading</span></header>
      <section class="glass-card rounded-2xl p-4" aria-labelledby="vault-heading"><div class="flex items-end justify-between"><div><h2 id="vault-heading" class="text-xs font-medium text-zinc-400">Total Vaulted Items</h2><p id="vault-count" class="mt-1 text-3xl font-semibold tabular-nums">—</p></div><span class="mb-1 text-xs text-zinc-500">Stored on this device</span></div></section>
      <section class="glass-card rounded-2xl p-4" aria-labelledby="inference-heading"><div class="mb-3 flex items-center justify-between"><h2 id="inference-heading" class="text-sm font-semibold">Inference mix</h2><span id="request-count" class="text-xs text-zinc-500">0 requests</span></div><div id="inference-bar" class="metric-track flex" role="img" aria-label="Local and cloud inference percentages"><div id="local-bar" class="metric-local share-0"></div><div id="cloud-bar" class="metric-cloud share-0"></div></div><div class="mt-3 flex items-center justify-between text-xs"><span class="flex items-center gap-2 text-cyan-300"><span class="h-2 w-2 rounded-full bg-cyan-400"></span>Local <span id="local-percent" class="font-semibold tabular-nums">0%</span></span><span class="flex items-center gap-2 text-orange-300"><span class="h-2 w-2 rounded-full bg-orange-500"></span>Cloud <span id="cloud-percent" class="font-semibold tabular-nums">0%</span></span></div><div class="mt-4 flex items-center justify-between border-t border-white/5 pt-3"><span class="text-xs text-zinc-400">Average latency</span><span id="average-latency" class="text-sm font-semibold tabular-nums">— ms</span></div></section>
      <section class="flex items-center justify-between gap-3"><span class="text-xs text-zinc-400">Local model</span><span id="model-status" class="status-cloud rounded-full px-3 py-1.5 text-xs font-semibold" role="status">Checking…</span></section>
      <section class="glass-card flex items-center justify-between gap-3 rounded-2xl p-4"><div><h2 class="text-sm font-medium">Strict Local-Only Mode</h2><p id="strict-local-description" class="mt-1 text-xs text-zinc-500">Prevent cloud inference and sync</p></div><label class="inline-flex cursor-pointer items-center gap-2"><span class="sr-only">Enable strict local-only mode</span><input id="strict-local-toggle" class="toggle-input" type="checkbox" /><span class="toggle-track" aria-hidden="true"></span></label></section>
      <p id="error-message" class="hidden rounded-xl border border-red-500/20 bg-red-500/10 p-3 text-xs text-red-200" role="alert"></p>
      <button id="open-dashboard" class="w-full rounded-xl border border-cyan-400/30 bg-cyan-500/10 px-4 py-3 text-sm font-semibold text-cyan-200 transition hover:border-cyan-300/60 hover:bg-cyan-500/15 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400" type="button">Open Knowledge Vault</button>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
