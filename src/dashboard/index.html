<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#09090b" /><title>GrassVault — Knowledge Vault</title></head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100 antialiased"><div class="min-h-screen bg-[radial-gradient(ellipse_at_10%_0%,rgba(6,182,212,0.12),transparent_35%)]">
    <header class="border-b border-white/5 bg-zinc-950/70"><div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-5 py-5 sm:px-8"><a class="flex items-center gap-3 text-inherit no-underline" href="#"><span class="grid h-11 w-11 place-items-center rounded-2xl border border-cyan-400/20 bg-cyan-400/10 text-xl text-cyan-300" aria-hidden="true">◈</span><span><span class="block text-lg font-semibold tracking-tight">GrassVault</span><span class="block text-xs text-zinc-500">Your cross-device knowledge vault</span></span></a><div class="flex items-center gap-3"><span id="sync-status" class="rounded-full border border-zinc-700 px-3 py-1.5 text-xs text-zinc-400" role="status">Connecting…</span><button id="refresh-button" class="rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-xs font-medium text-zinc-300 transition hover:border-cyan-400/30 hover:text-cyan-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400" type="button">Refresh</button></div></div></header>
    <main class="mx-auto max-w-7xl space-y-8 px-5 py-8 sm:px-8">
      <section class="grid gap-4 sm:grid-cols-3"><article class="glass-card rounded-2xl p-5"><p class="text-sm text-zinc-400">Vault items</p><p id="total-count" class="mt-2 text-3xl font-semibold tabular-nums">—</p></article><article class="glass-card rounded-2xl p-5"><p class="text-sm text-zinc-400">Local inference</p><p id="local-count" class="mt-2 text-3xl font-semibold tabular-nums text-cyan-300">—</p></article><article class="glass-card rounded-2xl p-5"><p class="text-sm text-zinc-400">Cloud inference</p><p id="cloud-count" class="mt-2 text-3xl font-semibold tabular-nums text-orange-300">—</p></article></section>
      <section class="space-y-5"><div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-end"><div><h1 class="text-2xl font-semibold tracking-tight">Knowledge Vault</h1><p class="mt-1 text-sm text-zinc-500">Search and manage snippets saved on this device and synced to your account.</p></div><div class="flex flex-col gap-3 sm:flex-row"><label class="sr-only" for="search-input">Search vault items</label><input id="search-input" class="min-w-0 rounded-xl border border-white/10 bg-zinc-900/80 px-4 py-2.5 text-sm text-zinc-100 outline-none placeholder:text-zinc-600 focus:border-cyan-500/50 focus:ring-2 focus:ring-cyan-500/10 sm:w-72" type="search" placeholder="Search snippets or source…" autocomplete="off" /><label class="sr-only" for="filter-select">Filter vault items</label><select id="filter-select" class="rounded-xl border border-white/10 bg-zinc-900 px-4 py-2.5 text-sm text-zinc-300 outline-none focus:border-cyan-500/50"><option value="all">All items</option><option value="local">Local inference</option><option value="cloud">Cloud inference</option></select></div></div><p id="page-error" class="hidden rounded-xl border border-red-500/20 bg-red-500/10 p-4 text-sm text-red-200" role="alert"></p><div id="empty-state" class="glass-card hidden rounded-2xl px-6 py-16 text-center"><p class="text-lg font-medium text-zinc-200">No vault items found</p><p class="mt-2 text-sm text-zinc-500">Save a selection from a page, or adjust your search and filters.</p></div><div id="vault-list" class="grid gap-4 lg:grid-cols-2" aria-live="polite"></div></section>
    </main>
  </div><script type="module" src="./app.js"></script></body>
</html>
